<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Табло черги - Ауд. 115</title>
  <style>
    body { 
      background-color: #0b1325; 
      color: #e2e8f0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      padding: 30px; /* Трохи більші відступи від країв екрана */
      box-sizing: border-box;
      overflow: hidden; /* Забороняємо прокручування екрана вниз */
    }
    
    h1 { 
      color: #38bdf8; 
      font-size: 42px; /* Більший заголовок */
      margin-top: 10px; 
      margin-bottom: 30px; 
      text-transform: uppercase; 
      letter-spacing: 2px;
      flex-shrink: 0; 
    }
    
    .grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      grid-template-rows: 1fr 1fr; /* Дві однакові за висотою колонки */
      gap: 30px; /* Більша відстань між картками */
      width: 100%; 
      max-width: 100%; /* Дозволяємо займати всю ширину екрана iPad */
      flex-grow: 1; /* Змушуємо сітку розтягнутися на весь вільний простір по вертикалі */
      padding-bottom: 20px;
    }
    
    .card { 
      background-color: #112240; 
      border-radius: 20px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; /* Центруємо текст всередині картки по вертикалі */
      align-items: center; /* Центруємо по горизонталі */
      text-align: center; 
      border: 2px solid #233f6e; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    .queue-name { 
      font-size: 26px; /* Значно більший шрифт для назви спеціальності */
      color: #8892b0; 
      margin-bottom: 20px; 
      font-weight: bold;
    }
    
    .ticket { 
      font-size: 140px; /* Величезний шрифт для самого номера */
      font-weight: 800; 
      color: #34d399; 
      margin: 0; 
      line-height: 1; 
      transition: color 0.3s ease;
    }
    
    /* Анімація блимання для ВСІЄЇ картки */
    .active-blink-card {
      animation: flash-card 1s infinite;
      border-color: #fbbf24 !important; 
    }
    
    @keyframes flash-card {
      0%, 100% { 
        background-color: #112240; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        transform: scale(1); 
      }
      50% { 
        background-color: #1e293b; 
        box-shadow: 0 0 50px rgba(252, 211, 77, 0.4); 
        transform: scale(1.02); /* Легке збільшення, щоб не ламати сітку */
      }
    }

    /* Колір тексту всередині активної картки */
    .active-blink-card .ticket {
      color: #fcd34d !important;
    }

    /* Стартовий екран для дозволу на звук */
    #start-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0b1325; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    
    .start-btn {
      background-color: #0ea5e9; color: white; border: none;
      padding: 20px 40px; font-size: 22px; border-radius: 15px;
      font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Системний звук -->
  <audio id="bell-sound" src="https://actions.google.com/sounds/v1/alarms/dinner_bell.ogg" preload="auto"></audio>

  <!-- Екран розблокування -->
  <div id="start-overlay">
    <h2 style="color: #e2e8f0; margin-bottom: 30px;">Табло готове до роботи</h2>
    <button class="start-btn" onclick="startDashboard()">▶ Запустити екран</button>
    <p style="color: #64748b; margin-top: 20px;">Натисніть кнопку, щоб надати системі дозвіл на відтворення звуку</p>
  </div>

  <h1>ЗАРАЗ ПРИЙМАЮТЬ</h1>
  
  <div class="grid">
    <div class="card" id="card-A">
      <div class="queue-name">Облік / Фінанси</div>
      <div class="ticket" id="val-A">—</div>
    </div>
    <div class="card" id="card-B">
      <div class="queue-name">Менеджмент</div>
      <div class="ticket" id="val-B">—</div>
    </div>
    <div class="card" id="card-C">
      <div class="queue-name">Управління та цифрове</div>
      <div class="ticket" id="val-C">—</div>
    </div>
    <div class="card" id="card-D">
      <div class="queue-name">Логістика / Соцзабезпечення</div>
      <div class="ticket" id="val-D">—</div>
    </div>
  </div>

  <script>
    
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxANxP7nvWMhi_2rQ6_z9cUvH34PBwsHAtsC4EN39izF4cO3_cvuoF1hMrvULS0FCGf/exec"; 
    
    let previousData = { A: "", B: "", C: "", D: "" };
    let isFirstLoad = true;

    function startDashboard() {
      document.getElementById("start-overlay").style.display = "none";
      
      let bell = document.getElementById("bell-sound");
      bell.play().catch(e => console.log(e));
      setTimeout(() => { bell.pause(); bell.currentTime = 0; }, 100);

      fetchDashboardData();
      setInterval(fetchDashboardData, 4000);
    }

    function fetchDashboardData() {
      fetch(WEB_APP_URL + "?action=getDashboard")
        .then(response => response.json())
        .then(data => {
          updateSlot('A', data.A);
          updateSlot('B', data.B);
          updateSlot('C', data.C);
          updateSlot('D', data.D);
          isFirstLoad = false;
        })
        .catch(error => console.log("Помилка завантаження:", error));
    }

    function updateSlot(queueId, newValue) {
      let el = document.getElementById("val-" + queueId);
      let cardEl = document.getElementById("card-" + queueId); 
      
      if (!isFirstLoad && previousData[queueId] !== newValue && newValue !== "—") {
        
        let bell = document.getElementById("bell-sound");
        bell.currentTime = 0; 
        bell.play().catch(e => console.log("Не вдалося відтворити звук", e));
        
        cardEl.classList.add("active-blink-card");
        
        setTimeout(() => {
          cardEl.classList.remove("active-blink-card");
        }, 60000);
      }
      
      el.innerText = newValue || "—";
      previousData[queueId] = newValue;
    }
  </script>

</body>
</html>
